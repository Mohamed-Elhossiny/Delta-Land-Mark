<footer class="mt-footer">
  @if (site$ | async; as site) {
    <div class="mt-footer__inner">
      <a class="mt-footer__brand" routerLink="/">
        <img class="mt-footer__logo" [src]="logoSrc" width="160" height="160" alt="Delta LandMark" />
      </a>
      <p class="mt-footer__copy">
        {{ site.contact.address | localize }}
        <br />
        {{ site.identity.name | localize }} • {{ 'footer.allRightsReserved' | translate }}
      </p>
    </div>
  }
</footer>
