@for (loader of loaders(); track loader.id) {
  <app-intro-loader [variant]="loader.variant" (finished)="onLoaderFinished(loader.id)" />
}

<app-header
  [overlay]="heroOverlay()"
  [menuOpen]="menuOpen()"
  (toggleMenu)="toggleMenu()"
/>

<app-burger-menu [open]="menuOpen()" (close)="closeMenu()" />

<main class="shell" [@routeAnimations]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet" />
</main>

<app-footer />
<app-contact-fab />
<app-back-to-top />
