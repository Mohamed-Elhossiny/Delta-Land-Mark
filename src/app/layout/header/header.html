<header
  class="mt-nav"
  [class.mt-nav--solid]="scrolled() || !overlay()"
  [class.mt-nav--menu-open]="menuOpen()"
>
  <a class="mt-nav__brand" routerLink="/">
    <img class="mt-nav__logo" [src]="logoSrc" alt="Delta LandMark" />
  </a>

  <nav class="mt-nav__links" [attr.aria-label]="'header.menu' | translate">
    @if (nav$ | async; as items) {
      @for (item of items; track item.id) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
          {{ item.label | localize }}
        </a>
      }
    }
    <a class="nav-link" routerLink="/integrated-experience" routerLinkActive="is-active">
      {{ 'nav.integratedExperience' | translate }}
    </a>
  </nav>

  <div class="mt-nav__end">
    <button class="mt-nav__lang" type="button" (click)="toggleLocale()">
      {{ 'header.langSwitch' | translate }}
    </button>

    @if (whatsapp$ | async; as wa) {
      <a class="liquid-btn liquid-btn--nav" appLiquidBtn [href]="wa" target="_blank" rel="noopener noreferrer">
        <span>{{ 'header.cta' | translate }}</span>
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    }

    <button class="mt-nav__burger" type="button" (click)="toggleMenu.emit()" [attr.aria-expanded]="menuOpen()">
      <span></span><span></span>
    </button>
  </div>
</header>
