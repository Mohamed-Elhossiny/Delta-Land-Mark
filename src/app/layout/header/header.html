<header
  class="header"
  [class.header--solid]="scrolled() || !overlay()"
  [class.header--menu-open]="menuOpen()"
>
  <div class="header__inner">
    <a class="header__brand" routerLink="/">
      <span class="header__mark">
        <span class="header__core bio-pulse"></span>
      </span>
      <span class="header__identity">
        <span class="header__name">{{ 'header.brand' | translate }}</span>
        <span class="header__tagline">{{ 'header.tagline' | translate }}</span>
      </span>
    </a>

    <div class="header__end">
      <button class="header__lang" type="button" (click)="toggleLocale()">
        {{ 'header.langSwitch' | translate }}
      </button>

      @if (whatsapp$ | async; as wa) {
        <a class="header__whatsapp" [href]="wa" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path fill="currentColor" d="M12.004 2C6.477 2 2 6.477 2 12.01c0 1.76.458 3.415 1.26 4.855L2 22l5.309-1.39A9.934 9.934 0 0 0 12.004 22C17.53 22 22 17.523 22 12.01 22 6.477 17.53 2 12.004 2z"/>
          </svg>
        </a>
      }

      <button
        class="bio-toggle"
        type="button"
        id="state-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="'header.themeToggle' | translate"
      ></button>

      <button class="header__burger" type="button" (click)="toggleMenu.emit()" [attr.aria-expanded]="menuOpen()">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
