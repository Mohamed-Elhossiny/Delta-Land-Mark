<div
  class="contact-fab"
  [class.contact-fab--open]="open()"
  (click)="$event.stopPropagation()"
>
  <span class="contact-fab__spot" aria-hidden="true"></span>
  @if (vm$ | async; as vm) {
    <div class="contact-fab__items" [attr.aria-hidden]="!open()">
      <a
        class="contact-fab__item"
        style="--i: 0"
        [href]="vm.phoneHref"
        [attr.tabindex]="open() ? 0 : -1"
        [attr.aria-label]="'footer.phone' | translate"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M7.2 3.8c.4-.4 1-.5 1.5-.3l2.3 1c.5.2.8.7.8 1.3v2.1c0 .4-.2.8-.5 1.1l-1.2 1.2c.8 1.5 1.9 2.7 3.4 3.4l1.2-1.2c.3-.3.7-.5 1.1-.5h2.1c.6 0 1.1.3 1.3.8l1 2.3c.2.5.1 1.1-.3 1.5l-1.3 1.3c-.4.4-1 .6-1.6.6C11.2 20.2 3.8 12.8 3.8 5.4c0-.6.2-1.2.6-1.6L7.2 3.8z"
          />
        </svg>
      </a>

      <a
        class="contact-fab__item"
        style="--i: 1"
        [href]="vm.whatsapp"
        target="_blank"
        rel="noopener noreferrer"
        [attr.tabindex]="open() ? 0 : -1"
        [attr.aria-label]="'footer.whatsapp' | translate"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12.04 2.5A9.5 9.5 0 0 0 3.2 16.3L2.5 21.5l5.3-.7A9.5 9.5 0 1 0 12.04 2.5zm5.5 13.5c-.23.65-1.35 1.2-1.86 1.28-.48.07-1.1.1-1.77-.11-.41-.13-.93-.3-1.61-.59-2.84-1.23-4.68-4.1-4.82-4.29-.14-.19-1.14-1.52-1.14-2.9 0-1.37.72-2.05.97-2.33.25-.28.55-.35.73-.35h.53c.17 0 .4-.06.62.47.23.56.77 1.93.84 2.07.07.14.11.3.02.49-.09.19-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.57.16.28.7 1.16 1.51 1.88 1.04.92 1.92 1.21 2.2 1.35.28.14.44.12.6-.07.16-.19.7-.81.88-1.09.19-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.33.07.12.07.65-.16 1.3z"
          />
        </svg>
      </a>

      <a
        class="contact-fab__item"
        style="--i: 2"
        [href]="vm.facebook"
        target="_blank"
        rel="noopener noreferrer"
        [attr.tabindex]="open() ? 0 : -1"
        [attr.aria-label]="'footer.facebook' | translate"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h2.6l.4-3H13v-2c0-.6.4-1 1-1z"
          />
        </svg>
      </a>

      <a
        class="contact-fab__item"
        style="--i: 3"
        [href]="vm.maps"
        target="_blank"
        rel="noopener noreferrer"
        [attr.tabindex]="open() ? 0 : -1"
        [attr.aria-label]="'footer.maps' | translate"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 3.5c-3.6 0-6.5 2.8-6.5 6.3 0 4.7 6.5 10.7 6.5 10.7s6.5-6 6.5-10.7c0-3.5-2.9-6.3-6.5-6.3zm0 8.5a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z"
          />
        </svg>
      </a>
    </div>
  }

  <button
    class="contact-fab__toggle"
    type="button"
    (click)="toggle(); $event.stopPropagation()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="(open() ? 'common.closeContact' : 'common.openContact') | translate"
  >
    <svg class="contact-fab__icon contact-fab__icon--open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        fill="currentColor"
        d="M7.2 3.8c.4-.4 1-.5 1.5-.3l2.3 1c.5.2.8.7.8 1.3v2.1c0 .4-.2.8-.5 1.1l-1.2 1.2c.8 1.5 1.9 2.7 3.4 3.4l1.2-1.2c.3-.3.7-.5 1.1-.5h2.1c.6 0 1.1.3 1.3.8l1 2.3c.2.5.1 1.1-.3 1.5l-1.3 1.3c-.4.4-1 .6-1.6.6C11.2 20.2 3.8 12.8 3.8 5.4c0-.6.2-1.2.6-1.6L7.2 3.8z"
      />
    </svg>
    <svg class="contact-fab__icon contact-fab__icon--close" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        fill="currentColor"
        d="M6.3 6.3a1 1 0 0 1 1.4 0L12 10.6l4.3-4.3a1 1 0 1 1 1.4 1.4L13.4 12l4.3 4.3a1 1 0 0 1-1.4 1.4L12 13.4l-4.3 4.3a1 1 0 0 1-1.4-1.4L10.6 12 6.3 7.7a1 1 0 0 1 0-1.4z"
      />
    </svg>
  </button>
</div>
