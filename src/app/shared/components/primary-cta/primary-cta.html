@if (external()) {
  <a
    class="cta"
    [class.cta--ghost]="variant() === 'ghost'"
    [href]="href()"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="cta__text">{{ label() }}</span>
    <span class="cta__arrow" aria-hidden="true">←</span>
  </a>
} @else {
  <a
    class="cta"
    [class.cta--ghost]="variant() === 'ghost'"
    [routerLink]="href()"
  >
    <span class="cta__text">{{ label() }}</span>
    <span class="cta__arrow" aria-hidden="true">←</span>
  </a>
}
