<section class="page-hero">
  @if (imageUrl()) {
    <img class="page-hero__media" [src]="imageUrl()" alt="" />
  }
  <div class="page-hero__overlay"></div>
  <div class="page-hero__content x-padding">
    <h1 class="display-1 synaptic-shimmer">{{ title() | localize }}</h1>
    @if (subtitle()) {
      <p class="page-hero__subtitle">{{ subtitle() | localize }}</p>
    }
  </div>
</section>
